[package]
name = "nanomail"
version = "0.1.0"
description = "Eigener Mail- & Kalender-Client für Ubuntu"
edition = "2021"
license = "MIT"
repository = "https://github.com/onyvaxyz/nanomail"

[lib]
name = "nanomail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
directories = "6"

[profile.release]
strip = true
lto = true
codegen-units = 1
