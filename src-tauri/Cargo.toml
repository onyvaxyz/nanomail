[package]
name = "nanomail"
version = "0.1.0"
description = "Eigener Mail- & Kalender-Client für Ubuntu"
edition = "2021"
license = "MIT"
repository = "https://github.com/onyvaxyz/nanomail"

[lib]
name = "nanomail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
directories = "6"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "net", "io-util", "macros", "time"] }
async-imap = { version = "0.11.2", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pki-types = "1.15.0"
webpki-roots = "1.0.8"
mail-parser = "0.11.4"
ammonia = "4.1.3"
thiserror = "2.0.18"
anyhow = "1.0.103"
base64 = "0.22.1"
rustls = { version = "0.23.41", default-features = false, features = ["ring", "logging", "std", "tls12"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
futures = "0.3.32"
rusqlite = { version = "0.37", features = ["bundled"] }
keyring-core = "1.0.0"
zbus-secret-service-keyring-store = { version = "1.0.0", features = ["rt-tokio-crypto-rust"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
