<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mail — Nanomail</title>
  <link rel="stylesheet" href="phosphor/style.css" />
  <link rel="stylesheet" href="styles.css?v=18" />
</head>
<body class="fenster-mail">
  <header class="titelleiste" data-tauri-drag-region>
    <span id="fenster-titel" class="titelleiste-titel">Mail</span>
    <span class="fueller"></span>
    <button id="fenster-minimieren" class="fenster-knopf" type="button" title="Minimieren">
      <i class="ph-light ph-minus"></i>
    </button>
    <button id="fenster-maximieren" class="fenster-knopf" type="button" title="Maximieren">
      <i class="ph-light ph-square"></i>
    </button>
    <button id="fenster-schliessen" class="fenster-knopf schliessen" type="button" title="Schließen">
      <i class="ph-light ph-x"></i>
    </button>
  </header>

  <main id="mailfenster-inhalt">
    <header class="mailfenster-kopf">
      <div class="mailfenster-meta">
        <h1 id="mailfenster-titel">Lade Mail …</h1>
        <div id="mailfenster-absender"></div>
        <div id="mailfenster-empfaenger"></div>
      </div>
      <div class="lese-aktionen">
        <div class="lese-aktionen-knoepfe">
          <button id="mailfenster-antworten" class="icon-knopf" type="button" title="Antworten">
            <i class="ph-light ph-arrow-bend-up-left"></i>
          </button>
          <button id="mailfenster-allen-antworten" class="icon-knopf" type="button" title="Allen antworten">
            <i class="ph-light ph-arrow-bend-double-up-left"></i>
          </button>
          <button id="mailfenster-weiterleiten" class="icon-knopf" type="button" title="Weiterleiten">
            <i class="ph-light ph-arrow-bend-up-right"></i>
          </button>
        </div>
        <span id="mailfenster-datum" class="lese-datum"></span>
      </div>
    </header>

    <div id="mailfenster-bilder" class="hinweis-leiste versteckt">
      <span><i class="ph-light ph-image"></i> Externe Bilder wurden blockiert.</span>
      <button id="mailfenster-bilder-laden" class="knopf-sekundaer" type="button">Bilder laden</button>
      <button id="mailfenster-bilder-immer" class="knopf-sekundaer" type="button">
        Von dieser Quelle immer laden
      </button>
    </div>
    <iframe id="mailfenster-html" class="versteckt"
            sandbox="allow-top-navigation-by-user-activation"></iframe>
    <div id="mailfenster-text" class="scrollbereich versteckt"></div>
    <div id="mailfenster-anhaenge" class="versteckt"></div>
    <p id="mailfenster-fehler" class="fehler-text versteckt"></p>
  </main>

  <script src="thema.js"></script>
  <script src="fenster.js"></script>
  <script src="mail.js"></script>
</body>
</html>
