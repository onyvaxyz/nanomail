<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nanomail</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h1 class="logo">Nanomail</h1>
      <nav id="konten">
        <p class="platzhalter">Noch keine Konten eingerichtet.<br />Kommt mit Meilenstein M1.</p>
      </nav>
    </aside>

    <section id="mailliste">
      <header class="spalten-kopf">Posteingang</header>
      <div class="platzhalter">Hier erscheint die Mail-Liste (M1).</div>
    </section>

    <section id="lesebereich">
      <header class="spalten-kopf">Vorschau</header>
      <div class="platzhalter">Hier erscheint der Mail-Inhalt (M1).</div>
    </section>
  </div>

  <footer id="statusleiste">
    <span id="backend-status">Verbinde mit Backend …</span>
  </footer>

  <script src="main.js"></script>
</body>
</html>
